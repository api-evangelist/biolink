name: biolink
description: BioLink (百林科医药科技（上海）有限公司) is a Shanghai-based bioprocessing company that
  manufactures core equipment and single-use consumable solutions for biopharmaceutical
  manufacturing. Its product lines span cell culture and bioreactors, fluid management,
  chromatography purification, process filtration, and pre-formulated aqueous products
  (buffers, water for injection, defoamers), serving antibody therapeutics and ADCs,
  vaccines, cell and gene therapy, and recombinant protein production. BioLink is a
  portfolio company of Qiming Venture Partners and was added to the API Evangelist
  network as a company profile; it publishes no public API or developer program.
